<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Address fields. "p" is the form path: "from" or "to". Used inside th:object="${rateForm}". -->
<fieldset th:fragment="address(p, legend)" class="card">
    <legend th:text="${legend}">Address</legend>

    <div class="row">
        <label class="field">Contact name
            <input type="text" th:field="*{__${p}__.name}" maxlength="40" placeholder="John Smith">
            <span class="error" th:if="${#fields.hasErrors('__${p}__.name')}"
                  th:text="${#fields.errors('__${p}__.name')[0]}"></span>
        </label>
        <label class="field">Company
            <input type="text" th:field="*{__${p}__.company}" maxlength="40" placeholder="Acme Ltd.">
            <span class="error" th:if="${#fields.hasErrors('__${p}__.company')}"
                  th:text="${#fields.errors('__${p}__.company')[0]}"></span>
        </label>
    </div>

    <label class="field">Street address
        <input type="text" th:field="*{__${p}__.street}" maxlength="50" placeholder="123 Main St">
        <span class="error" th:if="${#fields.hasErrors('__${p}__.street')}"
              th:text="${#fields.errors('__${p}__.street')[0]}"></span>
    </label>

    <div class="row">
        <label class="field">City
            <input type="text" th:field="*{__${p}__.city}" maxlength="40" placeholder="Oakville">
            <span class="error" th:if="${#fields.hasErrors('__${p}__.city')}"
                  th:text="${#fields.errors('__${p}__.city')[0]}"></span>
        </label>
        <label class="field">Province
            <select th:field="*{__${p}__.province}">
                <option value="">Select</option>
                <option th:each="code : ${provinces}" th:value="${code}" th:text="${code}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('__${p}__.province')}"
                  th:text="${#fields.errors('__${p}__.province')[0]}"></span>
        </label>
        <label class="field">Postal code
            <input type="text" th:field="*{__${p}__.postalCode}" maxlength="7" placeholder="L6J 1H6">
            <span class="error" th:if="${#fields.hasErrors('__${p}__.postalCode')}"
                  th:text="${#fields.errors('__${p}__.postalCode')[0]}"></span>
        </label>
    </div>

    <label class="field">Phone
        <input type="tel" th:field="*{__${p}__.phone}" maxlength="15" placeholder="905 555 1234">
        <span class="error" th:if="${#fields.hasErrors('__${p}__.phone')}"
              th:text="${#fields.errors('__${p}__.phone')[0]}"></span>
    </label>
    <p class="hint">Country: Canada</p>
</fieldset>

<!-- One package dimension field. -->
<label th:fragment="number(name, label, step)" class="field">
    <span th:text="${label}">Label</span>
    <input type="number" th:field="*{__${name}__}" min="0" th:step="${step}">
    <span class="error" th:if="${#fields.hasErrors('__${name}__')}"
          th:text="${#fields.errors('__${name}__')[0]}"></span>
</label>

</body>
</html>
