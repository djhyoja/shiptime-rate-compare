spring:
  application:
    name: shiptime-rate-compare

server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie

shiptime:
  base-url: ${SHIPTIME_BASE_URL:https://sandboxrestapi.shiptime.com}
  username: ${SHIPTIME_USERNAME:}
  password: ${SHIPTIME_PASSWORD:}
  connect-timeout-ms: 5000
  read-timeout-ms: 15000
